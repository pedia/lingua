name: Release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # flutter-version: 3.19.0
      - run: flutter --version

      - name: Create local.properties
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          cat <<EOF > android/local.properties
          sdk.dir=$SDK_DIR
          flutter.sdk=$FLUTTER_ROOT
          EOF

      - name: Upgrade Gradle Wrapper
        working-directory: android
        run: ./gradlew wrapper --gradle-version=9.3.1 --distribution-type=all      

      - run: flutter pub get
      - run: flutter pub upgrade --tighten
      - run: flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
